<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tower Game - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #d7e2e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <canvas id="canvas" width="375" height="667"></canvas>

<script>
    // Инициализация Telegram Web App
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand(); // Разворачиваем на всю высоту экрана смартфона
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Состояние игры
    let score = 0;
    let gameActive = true;
    let cameraY = 0;
    let targetCameraY = 0;

    // Параметры блоков
    const blockHeight = 50;
    const initialWidth = 200;
    let currentSpeed = 3;

    // Массив со всеми построенными блоками (первый блок - фундамент)
    let blocks = [
        { x: 87.5, y: 600, width: initialWidth, color: '#e67e22' }
    ];

    // Текущий движущийся блок
    let currentBlock = {
        x: 0,
        y: 600 - blockHeight,
        width: initialWidth,
        direction: 1,
        color: '#3498db'
    };

    // Генерация случайного цвета для блоков
    function getRandomColor() {
        const colors = ['#3498db', '#9b59b6', '#1abc9c', '#f1c40f', '#e74c3c', '#2ecc71'];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    // Обработка тапа по экрану (установка блока)
    function handleTap() {
        if (!gameActive) return;

        const lastBlock = blocks[blocks.length - 1];
        
        // Вычисляем границы перекрытия блоков
        const leftEdge = Math.max(currentBlock.x, lastBlock.x);
        const rightEdge = Math.min(currentBlock.x + currentBlock.width, lastBlock.x + lastBlock.width);
        const overlapWidth = rightEdge - leftEdge;

        if (overlapWidth <= 0) {
            // Если промахнулся мимо башни — игра окончена
            gameActive = false;
            triggerGameOver();
            return;
        }

        // Блок успешно поставлен, обрезаем его по ширине перекрытия
        currentBlock.x = leftEdge;
        currentBlock.width = overlapWidth;
        currentBlock.color = getRandomColor();
        
        // Добавляем блок в массив стабильной башни
        blocks.push({...currentBlock});

        // Начисление очков (Идеальное попадание = 50, обычное = 25)
        const accuracy = Math.abs(currentBlock.x - lastBlock.x);
        if (accuracy < 8) {
            score += 50; 
        } else {
            score += 25; 
        }

        // Продвигаем камеру вверх каждые несколько этажей
        if (blocks.length > 4) {
            targetCameraY += blockHeight;
        }

        // Подготовка следующего движущегося блока
        currentSpeed = 3 + Math.floor(blocks.length / 5) * 0.5; 
        currentBlock = {
            x: currentBlock.direction > 0 ? 0 : canvas.width - overlapWidth,
            y: currentBlock.y - blockHeight,
            width: overlapWidth,
            direction: Math.random() > 0.5 ? 1 : -1,
            color: getRandomColor()
        };
    }

    // 🔥 ФУНКЦИЯ КОНЦА ИГРЫ — СТРОГО СДАЕМ ОЧКИ
    function triggerGameOver() {
        draw(); // Перерисовываем экран, чтобы отобразить плашку Game Over

        if (tg && tg.sendData) {
            // Передаем боту строку с текущими очками (например "50" или "150")
            const finalScore = score.toString();
            tg.sendData(finalScore);

            // Закрываем шторку игры через 500 миллисекунд
            setTimeout(() => {
                tg.close();
            }, 500);
        } else {
            // Если игра открыта в обычном браузере без Телеграма
            console.log("Данные не отправлены: запуск вне Telegram WebApp");
        }
    }

    // Слушатели событий клика и тапа
    window.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(); }, { passive: false });
    window.addEventListener('mousedown', (e) => { if(e.button === 0) handleTap(); });

    // Игровой цикл физики
    function update() {
        if (!gameActive) return;

        currentBlock.x += currentSpeed * currentBlock.direction;

        if (currentBlock.x + currentBlock.width > canvas.width) {
            currentBlock.x = canvas.width - currentBlock.width;
            currentBlock.direction = -1;
        } else if (currentBlock.x < 0) {
            currentBlock.x = 0;
            currentBlock.direction = 1;
        }

        if (cameraY < targetCameraY) {
            cameraY += 2;
        }
    }

    // Отрисовка графики
    function draw() {
        ctx.fillStyle = '#d7e2e6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(0, cameraY);

        // Рисуем построенную башню
        blocks.forEach(block => {
            ctx.fillStyle = block.color;
            ctx.fillRect(block.x, block.y, block.width, blockHeight);
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 1;
            ctx.strokeRect(block.x, block.y, block.width, blockHeight);
        });

        // Рисуем активный блок
        if (gameActive) {
            ctx.fillStyle = currentBlock.color;
            ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, blockHeight);
            ctx.strokeStyle = '#2c3e50';
            ctx.strokeRect(currentBlock.x, currentBlock.y, currentBlock.width, blockHeight);
        }

        ctx.restore();

        // Счётчик очков на экране
        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`SCORE: ${score}`, canvas.width / 2, 50);

        // Экран блокировки при проигрыше
        if (!gameActive) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 36px sans-serif';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
            
            ctx.font = 'bold 22px sans-serif';
            ctx.fillStyle = '#f1c40f';
            ctx.fillText(`Счёт: ${score} очков`, canvas.width / 2, canvas.height / 2 + 15);
            
            ctx.font = '16px sans-serif';
            ctx.fillStyle = '#bdc3c7';
            ctx.fillText('Отправляем результат боту...', canvas.width / 2, canvas.height / 2 + 55);
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
